<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeri Foto</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <header>

        <h1>📸 Galeri Foto</h1>

        <p>
            Koleksi foto saya
        </p>

    </header>


    <main class="media-page">

        <div class="page-top">

            <button
                class="back-button"
                onclick="goBack()">

                ← Kembali

            </button>

        </div>


        <div class="photo-gallery">

            <div class="photo-card">

                <img
                    src="rafiq.jpg"
                    alt="Foto 1">

                <h3>Foto Saya</h3>

            </div>


            <div class="photo-card">

                <img
                    src="rafiq.jpg"
                    alt="Foto 2">

                <h3>Foto Kedua</h3>

            </div>


            <div class="photo-card">

                <img
                    src="rafiq.jpg"
                    alt="Foto 3">

                <h3>Foto Ketiga</h3>

            </div>

        </div>

    </main>


    <script src="home.js"></script>

</body>

</html>
