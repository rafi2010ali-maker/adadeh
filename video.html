<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Galeri Video</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>


    <header>

        <h1>🎥 Galeri Video</h1>

        <p>
            Koleksi video saya
        </p>

    </header>


    <main class="media-page">

        <div class="page-top">

            <button
                class="back-button"
                onclick="goBack()">

                ← Kembali

            </button>

        </div>


        <div class="video-gallery">

            <div class="video-card">

                <video controls>

                    <source
                        src="video1.mp4"
                        type="video/mp4">

                    Browser kamu tidak mendukung video.

                </video>

                <h3>Video Pertama</h3>

            </div>


            <div class="video-card">

                <video controls>

                    <source
                        src="video2.mp4"
                        type="video/mp4">

                    Browser kamu tidak mendukung video.

                </video>

                <h3>Video Kedua</h3>

            </div>

        </div>

    </main>


    <script src="foto&video.js"></script>

</body>

</html>
